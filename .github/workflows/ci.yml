name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev

      - name: Compile (strict flags)
        run: |
          make clean
          make

      - name: Run test suite (ASan & UBSan)
        run: |
          make test

      - name: Headless smoke test
        run: |
          printf 'P6\n1 1\n255\n\xff\x00\x00' > /tmp/smoke.ppm
          code=0
          SDL_VIDEODRIVER=dummy timeout 2 ./build/viewer /tmp/smoke.ppm || code=$?
          [ "$code" -eq 124 ]
